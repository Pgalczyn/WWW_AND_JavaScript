<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <title>
        Example 1
    </title>
</head>
<body>
<div id="root">
    <!--
        Container for the component.
        React renders the specified HTML code inside the so-called container,
        i.e. the element of the website we choose.
    -->
</div>
<!-- The 'Hello' component -->
<script type="text/babel" data-type="module">
    import React,{useEffect,useState} from "https://esm.sh/react/?dev";
    import ReactDOMClient from "https://esm.sh/react-dom/client/?dev";




    const StudentCard = ({student}) => {
        const hasGrades = Object.values(student.notes).some(value => value !== 0);
        return (
            <>
                <div className={`card col-10 col-md-5 m-2 col-lg-5 col-xl-4 col-xxl-3 m-2 ${hasGrades ? "bg-light" : "bg-secondary"}`}>

                <img src={student.photo} alt="Student" width="100%" />
                    <div className="card-body">
                        <h5 className="card-title">{student.first_name + " " + student.last_name}</h5>
                        <ul className="list-group list-group-flush">
                            {Object.entries(student.notes).map(([key, value]) => {
                                if (Number(value) !== 0) {
                                    return <li key={key} className="list-group-item ">{key}: {value}</li>;
                                }
                                return null
                            })}
                        </ul>
                    </div>
                </div>
            </>
        )

    }

    const App = () =>{


        const [studentsData,setStudentsData] = useState([]);

        const handleSetStudentsData = () => {

            fetch(`/StudentsData.json`, {
                method: "GET",
                headers: {
                    "Content-Type": "application/json",
                }
                }).then(response => response.json())
            .then(data => {
                console.log("Odebrane dane:", data);
                console.log("Typ:", typeof data);
                console.log("Czy tablica:", Array.isArray(data));
                setStudentsData(data);
            });

        }
        useEffect(() => {
            handleSetStudentsData();
        },[])


        const changeNote = (stringInput) => {
            const userInput = stringInput.split(" ");
            const firstName = userInput[0];
            const lastName = userInput[1];
            const subject = userInput[2];
            const newGrade = userInput[3];

            const updatedStudents = studentsData.map(student => {
                if (
                    student.first_name.toLowerCase().trim() === firstName.toLowerCase().trim() &&
                    student.last_name.toLowerCase().trim() === lastName.toLowerCase().trim()
                ) {
                    return {
                        ...student,
                        notes: {
                            ...student.notes,
                            [subject]: newGrade
                        }
                    };
                }
                return student;
            });

            setStudentsData(updatedStudents);

            fetch(`/StudentsData.json`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updatedStudents)
            })
                .then(response => response.json())
                .then(data => {
                    console.log("Odpowiedź serwera:", data);
                });
        };

        return(
            <>
                <div className="container-fluid ">
                <form action="">

                    <label htmlFor="studentInput">Wzór:<br/> Imie Nazwisko przedmiot (opcjonalnie) ocena <br/>np. Jan
                        Kowalski Matematyka 5<br/></label>
                    <input type="text" name="student" id="studentInput" />
                    <input type="button" value="Dodaj" id="add" onClick={() =>{ changeNote(document.getElementById("studentInput").value)}}/>
                    <input type="button" value="Zmień" id="change" onClick={() => {changeNote(document.getElementById("studentInput").value)}} />
                    <input type="button" value="Wyświetl" id="show"/>

                </form>
                </div>
                <div className="container-fluid ">
                    <div className="row d-flex justify-content-center ">
                        {studentsData.map((student,index) => {
                            return <StudentCard key={index} student={student} />;
                        })}
                    </div>
                </div>
            </>
        );

    }

    const container = document.getElementById('root'); // Retrieving references per container
    const root = ReactDOMClient.createRoot(container); // Creating a React root for the given container
    root.render(<App/>);                            // Component rendering
</script>
</body>
</html>
